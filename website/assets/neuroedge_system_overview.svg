<path d="M1417 284 V183 Q1417 166 1399 166 H967 Q949 166 949 184 V247" fill="none" stroke="#6088a0" stroke-width="2.3" stroke-dasharray="8 7" marker-end="url(#arrf)"/>
<rect x="997" y="147" width="353" height="40" fill="#fff"/>
<text x="1172" y="173" class="loop" text-anchor="middle" fill="#426e88">Delayed calibration feedback</text>
<text x="1172" y="205" class="small" text-anchor="middle">Software investigation; no verified improvement</text>

<line x1="70" y1="662" x2="1630" y2="662" stroke="#ccd7dd" stroke-width="1.3"/>
<g transform="translate(75,694)">
