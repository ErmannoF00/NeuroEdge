<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1700" height="745" viewBox="0 0 1700 745" role="img" aria-labelledby="title desc">
<title id="title">NeuroEdge conceptual closed-loop neural communication platform</title>
<desc id="desc">Neural activity feeds recorded feature extraction, a simulation-verified memory-calibrated causal decoder, and a proposed communication interface. Two distinct feedback paths are indicated: user perception and delayed software calibration.</desc>
<defs>
 <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#315a73" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#668c9e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#78828a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
 <style>
  text {font-family: 'DejaVu Sans', 'Liberation Sans', Arial, sans-serif; fill:#233342;}
  .head {font-size:34px;font-weight:700;letter-spacing:-0.8px;}
  .subtitle {font-size:18px;fill:#5a6a74;}
  .section {font-size:20px;font-weight:700;}
  .section2 {font-size:19px;font-weight:650;}
  .body {font-size:17px;fill:#425663;}
  .small {font-size:14px;fill:#677580;}
  .micro {font-size:12px;fill:#637480;letter-spacing:1px;font-weight:600;}
  .loop {font-size:16px;font-weight:600;}
  .stroke {fill:none;stroke:#375c70;stroke-width:2.3;stroke-linejoin:round;stroke-linecap:round;}
 </style>
</defs>
