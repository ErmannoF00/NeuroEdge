 <path d="M455 0h44" stroke="#6088a0" stroke-width="2.4" stroke-dasharray="8 7"/>
 <text x="514" y="5" class="small">Experimental software adaptation</text>
 <path d="M970 0h44" stroke="#818d98" stroke-width="2.4"/>
 <text x="1026" y="5" class="small">Conceptual human feedback</text>
</g>
<text x="70" y="730" class="small">*Text/speech output, live acquisition, and human-in-the-loop performance are system objectives, not demonstrated end-to-end capabilities.</text>
</svg>