 <text x="965" y="361" class="section2" text-anchor="middle">Causal neural decoding</text>
 <text x="965" y="396" class="section2" text-anchor="middle">Transactional calibration</text>
 <text x="965" y="442" class="small" text-anchor="middle">Host-connected RTL · simulation verified</text>
</g>

