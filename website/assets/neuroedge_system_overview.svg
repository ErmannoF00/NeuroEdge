<rect x="284" y="48" width="2" height="35" fill="#c3d1d9"/>
<text x="315" y="75" font-size="23" fill="#344c5e">Closed-loop neural communication: system concept</text>
<text x="1597" y="72" class="micro" text-anchor="end">RESEARCH PLATFORM</text>
<line x1="70" y1="105" x2="1630" y2="105" stroke="#cdd8df" stroke-width="1.5"/>

