[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroedge-bci-asic"
version = "0.1.0"
description = "Causal neural decoding and integer accelerator reference implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3", "h5py>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "torch>=2.3", "pandas>=2", "matplotlib>=3.8"]
eeg = ["mne>=1.7"]

[tool.setuptools.packages.find]
include = ["neuroedge*"]

[tool.pytest.ini_options]
testpaths = ["verification/python"]
