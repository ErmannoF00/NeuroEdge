name: verify-source-and-hardware
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  numerical-and-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the RTL simulator and C compiler
        run: sudo apt-get update -qq && sudo apt-get install -y iverilog build-essential
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check source and scientific claims
        run: python scripts/check_publication.py --ci
      - name: Run Python, C, stream, memory and full synthetic RTL integration
        run: make PYTHON=python verify
      - name: Run independent synthetic motor-imagery RTL example
        run: make PYTHON=python verify-vertical
