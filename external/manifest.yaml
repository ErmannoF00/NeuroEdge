  - name: YANA
    role: event-driven SNN training/deployment/RTL reference
    url: https://github.com/fzi-forschungszentrum-informatik/yana
    license: CERN-OHL-W-2.0 hardware; EUPL-1.2 software
    status: safe_reference

  - name: OpenCIMTC
    role: memristor CIM compiler/software-stack reference
    url: https://github.com/Tsinghua-LEMON-Lab/OpenCIMTC
    license: MIT
    status: safe_reference
