  - name: NeuroSim
    role: device/circuit/architecture research estimator
    url: https://github.com/neurosim/NeuroSim
    license: CC BY-NC 4.0
    status: research_only_noncommercial

  - name: JART VCM
    role: physics-based RRAM compact model
    url: https://www.fz-juelich.de/en/pgi/pgi-7/research-groups-1/ag-menzel/jart-model
    license: redistribution terms not stated clearly on the model landing page
    status: optional_external
    note: download directly from FZ Juelich/RWTH; cite corresponding paper; do not vendor until terms are confirmed

  - name: EEG-Ferro
    role: FeFET-aware EEG/SNN methodology reference
    url: https://github.com/NEO-ETHZ/EEG-Ferro
    license: no license identified in the repository page checked
    status: verify_before_vendor
