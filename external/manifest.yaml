# Third-party sources are not silently vendored into this repository.
# status values: safe_reference, optional_external, research_only_noncommercial, verify_before_vendor
sources:
  - name: SYNtzulA
    role: ASIC neuromorphic reference
    url: https://github.com/EOLAB-2025/SYNtzulA
    license: MIT
    status: safe_reference
    citation: IEEE TCAD, DOI 10.1109/TCAD.2025.3645186

  - name: X-HEEP
    role: optional RISC-V MCU / accelerator host
    url: https://github.com/x-heep/x-heep
    license: Apache-2.0 WITH SHL-2.1 (unless otherwise noted)
    status: safe_reference

  - name: JKU IHP SG13G2 AMS chip template
    role: chip assembly / open AMS flow reference
    url: https://github.com/iic-jku/ihp-sg13g2-ams-chip-template
    license: Solderpad Hardware License v2.1 / file-specific open licenses
    status: safe_reference
